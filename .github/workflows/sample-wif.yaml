name: Validate GCP Access

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/984058527118/locations/global/workloadIdentityPools/testpool/providers/github
          service_account: YOUR_SERVICE_ACCOUNT@YOUR_PROJECT_ID.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify authentication
        run: |
          echo "Authenticated account:"
          gcloud auth list

      - name: Display active project
        run: |
          gcloud config list

      - name: Print access token
        run: |
          gcloud auth print-access-token | head -c 40
          echo "..."

      - name: List projects
        run: |
          gcloud projects list

      - name: List enabled services
        run: |
          gcloud services list --enabled

      - name: List Cloud Storage buckets
        run: |
          gcloud storage buckets list || true

      - name: Describe current service account
        run: |
          gcloud iam service-accounts describe \
            YOUR_SERVICE_ACCOUNT@YOUR_PROJECT_ID.iam.gserviceaccount.com
