name: Validate GCP Access (WIF)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/984058527118/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@project-1ecc0a85-35dd-4da5-85a.iam.gserviceaccount.com
          project_id: project-1ecc0a85-35dd-4da5-85a
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: project-1ecc0a85-35dd-4da5-85a

      - name: Verify authentication
        run: |
          set -euo pipefail
          echo "Authenticated account:"
          gcloud auth list
          gcloud config list
          gcloud auth print-access-token | head -c 40
          echo "..."
          gcloud projects describe project-1ecc0a85-35dd-4da5-85a --format='value(projectId)'
          gcloud iam service-accounts describe \
            github-actions@project-1ecc0a85-35dd-4da5-85a.iam.gserviceaccount.com
